<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bamzolin — Graphic Designer</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0E0C0B">

<!-- SEO / Open Graph -->
<meta name="description" content="Bamzolin — graphic designer building brand systems, social content, and educational visuals.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bamzolin — Graphic Designer">
<meta property="og:description" content="Brand systems, social content, and educational visuals that connect and convert.">
<meta property="og:image" content="assets/favicon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bamzolin — Graphic Designer">
<meta name="twitter:description" content="Brand systems, social content, and educational visuals that connect and convert.">
<meta name="twitter:image" content="assets/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E0C0B;
    --panel: #17140F;
    --ink: #FFFFFF;
    --ink-soft: #B9B2A8;
    --accent: #FF5A1F;
    --accent-2: #B3220A;
    --line: #2B2621;
    --radius: 20px;
    --font-body: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
    html{scroll-behavior:auto;}
  }

  html[data-theme="light"]{
    --bg: #F7F5F1;
    --panel: #FFFFFF;
    --ink: #1B1916;
    --ink-soft: #6B655C;
    --line: #E4E0D8;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(circle at 20% 10%, #FBEBDD 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #F3E7DB 0%, transparent 55%),
      #F7F5F1;
  }
  html[data-theme="light"] .gallery-item{background:linear-gradient(135deg, #EFEBE2, #E2DCD0);}
  html[data-theme="light"] .cs-visual, html[data-theme="light"] .deliverable-card{background:var(--panel);}
  html[data-theme="light"] .about-photo{background:linear-gradient(135deg, #EFEBE2, #E2DCD0);}

  .theme-toggle{
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; color:#fff;
    margin-right:10px;
  }

  .canvas{
    max-width:1800px;
    margin:0 auto;
    overflow:hidden;
    background:var(--bg);
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 32px;}

  @media (min-width:1100px){
    .canvas{max-width:1800px;}
    .wrap{max-width:1120px;}
    nav{padding:32px 48px;}
    .hero-body{padding:28px 48px 0;}
    .hero-features-heading{padding:44px 48px 0;}
    .hero-features{padding:18px 48px 0;}
    .brand-strip-label{padding:0 48px 16px;}
    .behind{padding:90px 48px; gap:70px;}
    .gallery{padding:0 48px 90px;}
    .case-study{padding:90px 48px;}
    .about{padding:90px 48px;}
    .documents{padding:60px 48px;}
    footer{padding:80px 48px 50px;}
    .testimonials, .building{padding:90px 48px;}
    .testimonials-grid, .building-grid{grid-template-columns:repeat(3, 1fr);}
    .cs-visual-grid{grid-template-columns:repeat(3, 1fr);}
    .hero-headline{font-size:clamp(2.4rem, 4.5vw, 3.6rem); max-width:11ch;}
    .behind h2{font-size:clamp(2rem, 3.2vw, 2.8rem);}
  }

  /* HERO (nav + gradient panel) */
  .hero-panel{
    position:relative;
    background:
      radial-gradient(ellipse 90% 70% at 65% 35%, var(--accent) 0%, var(--accent-2) 45%, #2a0805 75%, #150703 100%);
    padding-bottom:40px;
    overflow:hidden;
  }
  nav{display:flex; align-items:center; justify-content:space-between; padding:26px 32px; position:relative; z-index:3;}
  nav.logo-center{flex-direction:column; gap:10px; text-align:center;}
  .logo{font-weight:700; font-size:1.1rem; letter-spacing:-0.01em;}
  .logo img{display:block; height:30px; width:auto;}
  .navlinks{display:flex; gap:26px; font-size:0.92rem; color:rgba(255,255,255,0.85);}
  .navlinks a{text-decoration:none;}
  .nav-cta{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; color:#111;
    padding:9px 8px 9px 18px;
    border-radius:100px;
    font-size:0.88rem; font-weight:600;
    text-decoration:none;
  }
  .nav-cta .arrow{
    width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:0.9rem;
  }

  .hero-body{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px 32px 0;
    z-index:2;
    min-height:220px;
    align-items:end;
  }

  .hero-text{position:relative; z-index:2; padding-bottom:8px;}
  .hero-eyebrow{font-size:0.95rem; color:rgba(255,255,255,0.85); margin-bottom:6px; display:block;}
  .hero-headline{
    font-weight:700;
    font-size:clamp(2.1rem, 6vw, 3rem);
    line-height:1.05;
    letter-spacing:-0.02em;
    max-width:9ch;
  }
  .hero-tagline{
    position:relative; z-index:2;
    text-align:right;
    align-self:end;
  }
  .hero-tagline h3{
    font-weight:600;
    font-size:1.05rem;
    line-height:1.3;
    margin-bottom:8px;
  }
  .hero-tagline p{
    font-size:0.85rem;
    color:rgba(255,255,255,0.75);
    max-width:26ch;
    margin-left:auto;
  }

  .hero-features-heading{
    position:relative; z-index:2;
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.1em;
    color:rgba(255,255,255,0.6); font-weight:600;
    padding:36px 32px 0;
    display:block;
  }
  .hero-features{
    position:relative; z-index:2;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    padding:16px 32px 0;
  }
  .hero-feature .num{color:var(--accent); font-weight:600; font-size:0.82rem; margin-right:4px;}
  .hero-feature .label{font-size:0.86rem; color:rgba(255,255,255,0.9);}

  /* BRAND STRIP (ticker) */
  .brand-strip{
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:22px 0;
    overflow:hidden;
    white-space:nowrap;
  }
  .brand-strip-label{
    padding:0 32px 16px;
    font-size:0.78rem; color:var(--ink-soft); line-height:1.4;
  }
  .brand-ticker{overflow:hidden; white-space:nowrap;}
  .brand-ticker-track{display:inline-block; white-space:nowrap; animation:scroll-left 22s linear infinite;}
  .brand-logo-item{
    display:inline-flex; align-items:center; gap:8px;
    margin-right:44px;
    font-size:0.92rem; font-weight:600; color:rgba(255,255,255,0.8);
  }
  .brand-logo-item img{width:16px; height:16px; object-fit:contain; border-radius:3px;}

  /* BEHIND SECTION */
  .behind{
    background:var(--bg);
    padding:70px 32px;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:40px;
  }
  .behind-eyebrow{color:var(--accent); font-weight:600; font-size:0.9rem; margin-bottom:14px; display:block;}
  .behind h2{
    font-weight:700;
    font-size:clamp(1.8rem, 4.5vw, 2.4rem);
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  .behind-right p.lead{font-size:1.02rem; color:rgba(255,255,255,0.9); margin-bottom:24px;}
  .behind-cta-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .behind-cta-row p{font-size:0.82rem; color:var(--ink-soft); max-width:20ch;}

  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:12px 10px 12px 22px;
    border-radius:100px;
    font-size:0.92rem; font-weight:600;
    text-decoration:none;
    border:none; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary .arrow{background:rgba(255,255,255,0.25);}
  .btn-white{background:#fff; color:#111;}
  .btn-white .arrow{background:var(--accent); color:#fff;}
  .btn .arrow{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem;}
  .btn-outline{background:transparent; color:var(--ink); border:1px solid var(--line); padding:12px 20px;}
  .btn-outline:hover{border-color:var(--accent);}

  /* GALLERY */
  .gallery{background:var(--bg); padding:0 32px 70px;}
  .gallery-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
  .gallery-item{
    aspect-ratio:3/4;
    border-radius:14px;
    overflow:hidden;
    background:linear-gradient(135deg, #E9E7E1, #D8D5CC);
    display:flex; align-items:center; justify-content:center;
    color:rgba(0,0,0,0.45);
    font-size:0.75rem; text-align:center; padding:14px;
  }
  .gallery-item img{width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.05);}

  /* SECTION LABEL (shared) */
  .section-label{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent); margin-bottom:14px; display:block; font-weight:600;}

  /* CASE STUDY */
  .case-study{padding:70px 32px; border-top:1px solid var(--line); background:var(--panel);}
  .case-study + .case-study{padding-top:0; border-top:none;}
  .case-header{display:flex; flex-direction:column; gap:16px; margin-bottom:42px;}
  .case-header h2{font-weight:700; font-size:clamp(1.6rem, 4vw, 2.1rem); letter-spacing:-0.01em;}
  .case-meta{display:flex; flex-wrap:wrap; gap:24px; font-size:0.85rem; color:var(--ink-soft); padding-top:16px; border-top:1px solid var(--line);}
  .case-meta div span{display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin-bottom:4px;}
  .case-copy{display:grid; grid-template-columns:1fr 1fr; gap:50px; margin-bottom:44px;}
  .case-copy p{color:var(--ink-soft); margin-bottom:14px; font-size:0.92rem;}
  .case-copy h3{font-weight:600; font-size:1.1rem; margin-bottom:12px;}
  .deliverables{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
  .deliverable-card{background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .deliverable-card .num{color:var(--accent); font-size:0.78rem; margin-bottom:8px; display:block;}
  .deliverable-card h4{font-weight:600; font-size:1rem; margin-bottom:6px;}
  .deliverable-card p{font-size:0.85rem; color:var(--ink-soft);}

  .cs-visual-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:36px;}
  .cs-visual{
    aspect-ratio:4/3;
    border-radius:14px;
    overflow:hidden;
    background:var(--bg);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    font-size:0.8rem; text-align:center; padding:16px;
  }
  .cs-visual img{width:100%; height:100%; object-fit:cover; cursor:pointer; transition:transform 0.2s ease;}
  .cs-visual img:hover{transform:scale(1.03);}

  .view-more-wrap{display:flex; justify-content:center; margin-top:24px;}
  .view-more-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px;
    border-radius:100px;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:0.88rem; font-weight:600;
    text-decoration:none;
    transition:border-color 0.2s;
  }
  .view-more-btn:hover{border-color:var(--accent);}

  /* LIGHTBOX */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,0.9);
    display:none; align-items:center; justify-content:center;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:90vh; border-radius:10px;}
  .lightbox-close{
    position:absolute; top:20px; right:24px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.1); color:#fff;
    border:none; font-size:1.3rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .lightbox-close:hover{background:rgba(255,255,255,0.2);}

  .ticker-section{margin:0; padding:24px 0; background:#000; overflow:hidden; white-space:nowrap; border-top:1px solid var(--line);}
  .ticker-track{display:inline-block; white-space:nowrap; animation:scroll-left 26s linear infinite;}
  .ticker-track span{font-style:italic; font-size:1.15rem; margin-right:50px; color:rgba(255,255,255,0.85);}
  .ticker-track span b{font-style:normal; font-size:0.75rem; color:var(--accent); margin-right:10px;}
  @keyframes scroll-left{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  /* ABOUT */
  .about{padding:70px 32px; background:var(--bg); border-top:1px solid var(--line);}
  .about-grid{display:grid; grid-template-columns:1fr 1.4fr; gap:40px; align-items:start;}
  .about-photo{aspect-ratio:4/5; border-radius:16px; background:linear-gradient(135deg, #2a2620, #17140F); border:1px solid var(--line); overflow:hidden;}
  .about-photo img{width:100%; height:100%; object-fit:cover;}
  .about h2{font-weight:700; font-size:clamp(1.4rem, 3.2vw, 1.9rem); margin-bottom:16px;}
  .about p{color:var(--ink-soft); margin-bottom:14px; font-size:0.92rem;}

  /* DOCUMENTS */
  .documents{padding:50px 32px; background:var(--bg); border-top:1px solid var(--line);}
  .doc-list{display:flex; flex-direction:column; gap:10px;}
  .doc-item{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--ink); font-weight:500; font-size:0.9rem; transition:border-color 0.2s;}
  .doc-item:hover{border-color:var(--accent);}
  .doc-item .arrow{color:var(--accent); font-size:0.85rem;}

  /* SKILLS STRIP */
  .skills-strip{background:var(--bg); border-top:1px solid var(--line); padding:40px 32px;}
  .skills-heading{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:16px; display:block; font-weight:600;}
  .skills-row{display:flex; flex-wrap:wrap; gap:10px;}
  .skill-chip{padding:9px 16px; border-radius:100px; border:1px solid var(--line); font-size:0.85rem; color:var(--ink); background:var(--panel);}

  /* TESTIMONIALS */
  .testimonials{background:var(--bg); padding:70px 32px; border-top:1px solid var(--line);}
  .testimonials-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-top:28px;}
  .testimonial-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px;}
  .testimonial-card .quote{font-size:0.98rem; line-height:1.6; margin-bottom:18px; color:rgba(255,255,255,0.9);}
  html[data-theme="light"] .testimonial-card .quote{color:var(--ink);}
  .testimonial-card .person{font-size:0.85rem; color:var(--ink-soft);}
  .testimonial-card .person b{color:var(--ink); font-weight:600;}

  /* CURRENTLY BUILDING */
  .building{background:var(--bg); padding:70px 32px; border-top:1px solid var(--line);}
  .building-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-top:28px;}
  .building-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px;}
  .building-card .status{display:inline-block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); border:1px solid var(--accent); border-radius:100px; padding:4px 10px; margin-bottom:14px;}
  .building-card h4{font-weight:700; font-size:1.1rem; margin-bottom:8px;}
  .building-card p{font-size:0.88rem; color:var(--ink-soft); margin-bottom:14px;}
  .building-card a{font-size:0.85rem; font-weight:600; color:var(--accent); text-decoration:none;}

  /* CONTACT FORM */
  .contact-form{margin-top:20px; margin-bottom:44px; display:grid; gap:12px; max-width:480px;}
  .contact-form input, .contact-form textarea{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; color:var(--ink); font-family:var(--font-body); font-size:0.92rem;
  }
  .contact-form textarea{min-height:110px; resize:vertical;}
  .contact-form input::placeholder, .contact-form textarea::placeholder{color:var(--ink-soft);}
  .contact-form button{align-self:start;}
  footer{padding:60px 32px 40px; background:var(--panel); border-top:1px solid var(--line);}
  footer h2{font-weight:700; font-size:clamp(1.6rem, 4vw, 2.2rem); margin-bottom:22px; max-width:14ch;}
  .contact-links{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:44px;}
  .foot-bottom{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:0.8rem; color:var(--ink-soft); padding-top:22px; border-top:1px solid var(--line);}

  @media (max-width:720px){
    body{padding:12px 8px;}
    .hero-body{grid-template-columns:1fr; min-height:auto;}
    .hero-tagline{text-align:left;}
    .hero-tagline p{margin-left:0;}
    .hero-features{grid-template-columns:repeat(2, 1fr);}
    .navlinks{display:none;}
    .brand-strip{flex-direction:column; align-items:flex-start;}
    .behind{grid-template-columns:1fr;}
    .case-copy{grid-template-columns:1fr;}
    .deliverables{grid-template-columns:1fr;}
    .gallery-grid{grid-template-columns:1fr 1fr;}
    .about-grid{grid-template-columns:1fr;}
    .testimonials-grid{grid-template-columns:1fr;}
    .building-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<script>
  (function(){
    const saved = localStorage.getItem('bamzolin-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>

<div class="canvas" id="top">

  <div class="hero-panel">
    <nav id="site-nav">
      <div class="logo" id="site-logo">Bamzolin</div>
      <div class="navlinks" id="nav-links"></div>
      <div style="display:flex; align-items:center;">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
        <a href="#contact" class="nav-cta" id="nav-cta">Get in touch <span class="arrow">→</span></a>
      </div>
    </nav>

    <div class="hero-body">
      <div class="hero-text">
        <span class="hero-eyebrow" id="hero-eyebrow"></span>
        <h1 class="hero-headline" id="hero-headline"></h1>
      </div>
      <div class="hero-tagline">
        <h3 id="hero-tagline-h"></h3>
        <p id="hero-subtext"></p>
      </div>
    </div>

    <h4 class="hero-features-heading" id="hero-features-heading"></h4>
    <div class="hero-features" id="hero-features"></div>
  </div>

  <div class="brand-strip">
    <div class="brand-strip-label" id="brands-label"></div>
    <div class="brand-ticker">
      <div class="brand-ticker-track" id="brand-logos"></div>
    </div>
  </div>

  <div class="skills-strip">
    <span class="skills-heading" id="skills-heading"></span>
    <div class="skills-row" id="skills-row"></div>
  </div>

  <div class="behind">
    <div>
      <span class="behind-eyebrow" id="behind-eyebrow"></span>
      <h2 id="behind-headline"></h2>
    </div>
    <div class="behind-right">
      <p class="lead" id="behind-paragraph"></p>
      <div class="behind-cta-row">
        <p id="behind-subtext"></p>
        <a href="#" class="btn btn-white" id="behind-cta"></a>
      </div>
    </div>
  </div>

  <div class="gallery">
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <div id="work"></div>
  <div id="case-studies-container"></div>

  <section class="building" id="building-section" style="display:none;">
    <span class="section-label" id="building-heading"></span>
    <div class="building-grid" id="building-grid"></div>
  </section>

  <section class="testimonials" id="testimonials-section" style="display:none;">
    <span class="section-label" id="testimonials-heading"></span>
    <div class="testimonials-grid" id="testimonials-grid"></div>
  </section>

  <section class="about" id="about">
    <div class="about-grid">
      <div class="about-photo" id="about-photo"></div>
      <div>
        <h2>A bit about me</h2>
        <div id="about-paragraphs"></div>
      </div>
    </div>
  </section>

  <section class="documents" id="documents-section" style="display:none;">
    <span class="section-label">Resources</span>
    <div class="doc-list" id="doc-list"></div>
  </section>

  <footer id="contact">
    <h2 id="footer-title"></h2>
    <form class="contact-form" id="contact-form" style="display:none;">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="Your email" required>
      <textarea name="message" placeholder="Tell me about your project" required></textarea>
      <input type="text" name="_gotcha" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="btn btn-primary">Send message <span class="arrow">→</span></button>
    </form>
    <div class="contact-links" id="footer-ctas"></div>
    <div class="foot-bottom">
      <span id="footer-name"></span>
      <span id="footer-year"></span>
    </div>
  </footer>

</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
async function loadSite(){
  let data;
  try{
    const res = await fetch('content.json', { cache: 'no-store' });
    data = await res.json();
  }catch(e){
    console.error('Could not load content.json', e);
    return;
  }

  // THEME
  if (data.theme){
    const root = document.documentElement.style;
    if (data.theme.bg_color) root.setProperty('--bg', data.theme.bg_color);
    if (data.theme.text_color) root.setProperty('--ink', data.theme.text_color);
    if (data.theme.accent_color) root.setProperty('--accent', data.theme.accent_color);
    if (data.theme.accent_color_2) root.setProperty('--accent-2', data.theme.accent_color_2);
    if (data.theme.font_body) root.setProperty('--font-body', `'${data.theme.font_body}', sans-serif`);

    const logoEl = document.getElementById('site-logo');
    if (data.theme.logo){
      logoEl.innerHTML = `<img src="${data.theme.logo}" alt="Logo">`;
    } else if (data.nav && data.nav.logo_text){
      logoEl.textContent = data.nav.logo_text;
    }
    const navEl = document.getElementById('site-nav');
    if (data.theme.logo_position === 'center'){ navEl.classList.add('logo-center'); }
  }

  // NAV
  if (data.nav){
    document.getElementById('nav-links').innerHTML = (data.nav.links || []).map(l =>
      `<a href="${l.url}">${escapeHtml(l.label)}</a>`
    ).join('');
    const navCta = document.getElementById('nav-cta');
    navCta.href = data.nav.cta_link || '#contact';
    navCta.innerHTML = `${escapeHtml(data.nav.cta_label || 'Get in touch')} <span class="arrow">→</span>`;
  }

  // HERO
  const h = data.hero;
  document.getElementById('hero-eyebrow').textContent = h.eyebrow;
  document.getElementById('hero-headline').textContent = h.headline;
  document.getElementById('hero-tagline-h').textContent = h.tagline;
  document.getElementById('hero-subtext').textContent = h.subtext;
  document.getElementById('hero-features-heading').textContent = h.features_heading || '';

  document.getElementById('hero-features').innerHTML = (h.features || []).map(f => `
    <div class="hero-feature"><span class="num">#${f.number}</span><span class="label">${escapeHtml(f.label)}</span></div>
  `).join('');

  // BRAND STRIP
  if (data.brands){
    document.getElementById('brands-label').textContent = data.brands.label;
    const logoItems = (data.brands.logos || []).map(b => `
      <span class="brand-logo-item">${b.icon ? `<img src="${b.icon}" alt="">` : ''}${escapeHtml(b.name)}</span>
    `).join('');
    document.getElementById('brand-logos').innerHTML = logoItems + logoItems;
  }

  // BEHIND
  if (data.behind){
    const b = data.behind;
    document.getElementById('behind-eyebrow').textContent = b.eyebrow;
    document.getElementById('behind-headline').textContent = b.headline;
    document.getElementById('behind-paragraph').textContent = b.paragraph;
    document.getElementById('behind-subtext').textContent = b.subtext;
    const bc = document.getElementById('behind-cta');
    bc.href = b.cta_link || '#contact';
    bc.innerHTML = `${escapeHtml(b.cta_label || 'Get in touch')} <span class="arrow">→</span>`;
  }

  // GALLERY
  document.getElementById('gallery-grid').innerHTML = (data.gallery || []).map(g => {
    if (g.image){
      return `<div class="gallery-item"><img src="${g.image}" alt="${escapeHtml(g.caption || '')}" loading="lazy" decoding="async"></div>`;
    }
    return `<div class="gallery-item">${escapeHtml(g.caption || 'Add an image')}</div>`;
  }).join('');

  // SKILLS STRIP
  if (data.skills){
    document.getElementById('skills-heading').textContent = data.skills.heading || '';
    document.getElementById('skills-row').innerHTML = (data.skills.items || []).map(s =>
      `<span class="skill-chip">${escapeHtml(s)}</span>`
    ).join('');
  }

  // CASE STUDIES
  const studies = data.case_studies || [];
  document.getElementById('case-studies-container').innerHTML = studies.map((cs, idx) => `
    <section class="case-study">
      <div class="case-header">
        <span class="section-label">${escapeHtml(cs.label || '')}</span>
        <h2>${escapeHtml(cs.title || '')}</h2>
        <div class="case-meta">
          <div><span>Client</span>${escapeHtml(cs.client || '')}</div>
          <div><span>Category</span>${escapeHtml(cs.category || '')}</div>
          <div><span>Role</span>${escapeHtml(cs.role || '')}</div>
          <div><span>Tools</span>${escapeHtml(cs.tools || '')}</div>
        </div>
      </div>
      <div class="case-copy">
        <div><h3>The brief</h3><p>${escapeHtml(cs.brief || '')}</p></div>
        <div><h3>The approach</h3><p>${escapeHtml(cs.approach || '')}</p></div>
      </div>
      <div class="deliverables">
        ${(cs.deliverables || []).map((d, i) => `
          <div class="deliverable-card">
            <span class="num">0${i + 1}</span>
            <h4>${escapeHtml(d.title)}</h4>
            <p>${escapeHtml(d.description)}</p>
          </div>
        `).join('')}
      </div>
      <div class="cs-visual-grid">
        ${(cs.images || []).map(v => v.image
          ? `<div class="cs-visual"><img src="${v.image}" alt="${escapeHtml(v.caption || '')}" class="cs-lightbox-trigger" data-full="${v.image}" loading="lazy" decoding="async"></div>`
          : `<div class="cs-visual">${escapeHtml(v.caption || 'Add an image')}</div>`
        ).join('')}
      </div>
      ${cs.view_more_link ? `
        <div class="view-more-wrap">
          <a href="${cs.view_more_link}" class="view-more-btn" target="_blank" rel="noopener">${escapeHtml(cs.view_more_label || 'View more')} →</a>
        </div>
      ` : ''}
      ${(cs.ticker_facts && cs.ticker_facts.length) ? `
        <div class="ticker-section" aria-hidden="true" style="margin-top:44px; border-radius:14px;">
          <div class="ticker-track">
            ${(cs.ticker_facts.concat(cs.ticker_facts)).map(f => `<span><b>DID YOU KNOW</b>${escapeHtml(f)}</span>`).join('')}
          </div>
        </div>
      ` : ''}
    </section>
  `).join('');

  // CURRENTLY BUILDING
  const building = (data.building && data.building.items) || [];
  if (building.length){
    document.getElementById('building-section').style.display = '';
    document.getElementById('building-heading').textContent = (data.building && data.building.heading) || 'Currently Building';
    document.getElementById('building-grid').innerHTML = building.map(b => `
      <div class="building-card">
        ${b.status ? `<span class="status">${escapeHtml(b.status)}</span>` : ''}
        <h4>${escapeHtml(b.title || '')}</h4>
        <p>${escapeHtml(b.description || '')}</p>
        ${b.link ? `<a href="${b.link}" target="_blank" rel="noopener">Learn more →</a>` : ''}
      </div>
    `).join('');
  }

  // TESTIMONIALS
  const testimonials = (data.testimonials && data.testimonials.items) || [];
  if (testimonials.length){
    document.getElementById('testimonials-section').style.display = '';
    document.getElementById('testimonials-heading').textContent = (data.testimonials && data.testimonials.heading) || 'What People Say';
    document.getElementById('testimonials-grid').innerHTML = testimonials.map(t => `
      <div class="testimonial-card">
        <p class="quote">"${escapeHtml(t.quote || '')}"</p>
        <p class="person"><b>${escapeHtml(t.name || '')}</b>${t.role ? ' — ' + escapeHtml(t.role) : ''}</p>
      </div>
    `).join('');
  }

  // ABOUT
  if (data.about){
    if (data.about.photo){
      document.getElementById('about-photo').innerHTML = `<img src="${data.about.photo}" alt="Portrait" loading="lazy" decoding="async">`;
    }
    document.getElementById('about-paragraphs').innerHTML =
      (data.about.paragraphs || []).map(p => `<p>${escapeHtml(p)}</p>`).join('');
  }

  // DOCUMENTS
  const docs = (data.documents || []).filter(d => d.file);
  if (docs.length){
    document.getElementById('documents-section').style.display = '';
    document.getElementById('doc-list').innerHTML = docs.map(d => `
      <a class="doc-item" href="${d.file}" download>
        <span>${escapeHtml(d.title)}</span>
        <span class="arrow">Download →</span>
      </a>
    `).join('');
  }

  // FOOTER / SOCIALS
  if (data.footer){
    document.getElementById('footer-title').textContent = data.footer.title;
    document.getElementById('footer-name').textContent = data.footer.name;
    document.getElementById('footer-year').textContent = '© ' + data.footer.year;
  }
  document.getElementById('footer-ctas').innerHTML = (data.socials || []).map(s => `
    <a href="${s.url}" class="btn ${s.style === 'primary' ? 'btn-primary' : 'btn-outline'}">${escapeHtml(s.label)}</a>
  `).join('');

  // CONTACT FORM
  if (data.contact_form && data.contact_form.formspree_id){
    const formEl = document.getElementById('contact-form');
    formEl.action = `https://formspree.io/f/${data.contact_form.formspree_id}`;
    formEl.method = 'POST';
    formEl.style.display = '';
  }

  // LIGHTBOX
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('cs-lightbox-trigger')){
      lightboxImg.src = e.target.dataset.full;
      lightboxImg.alt = e.target.alt;
      lightbox.classList.add('open');
    }
  });
  document.getElementById('lightbox-close').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

  // THEME TOGGLE
  const toggleBtn = document.getElementById('theme-toggle');
  function updateToggleIcon(){
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    toggleBtn.textContent = current === 'dark' ? '🌙' : '☀️';
  }
  updateToggleIcon();
  toggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('bamzolin-theme', next);
    updateToggleIcon();
  });
}

function escapeHtml(str){
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

loadSite();
</script>

</body>
