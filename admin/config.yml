backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main
  base_url: https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "content"
        label: "Full Site Content"
        file: "content.json"
        fields:
          - label: "Appearance"
            name: "theme"
            widget: "object"
            fields:
              - { label: "Background color", name: "bg_color", widget: "color" }
              - { label: "Text color", name: "text_color", widget: "color" }
              - { label: "Accent color (hero gradient start, CTAs)", name: "accent_color", widget: "color" }
              - { label: "Accent color 2 (hero gradient end)", name: "accent_color_2", widget: "color" }
              - label: "Body / UI font"
                name: "font_body"
                widget: "select"
                options: ["Space Grotesk", "Hanken Grotesk", "Familjen Grotesk", "Inter"]
              - { label: "Logo image (leave blank to use text logo)", name: "logo", widget: "image", required: false }
              - label: "Logo position"
                name: "logo_position"
                widget: "select"
                options: ["left", "center"]

          - label: "Navigation"
            name: "nav"
            widget: "object"
            fields:
              - { label: "Logo text (used if no logo image)", name: "logo_text", widget: "string" }
              - label: "Nav links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "url", widget: "string" }
              - { label: "Nav button label", name: "cta_label", widget: "string" }
              - { label: "Nav button link", name: "cta_link", widget: "string" }

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow (\"Hey, I'm a\")", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Tagline (right side, bold)", name: "tagline", widget: "string" }
              - { label: "Subtext (right side, smaller)", name: "subtext", widget: "text" }
              - { label: "Feature numbers row — heading", name: "features_heading", widget: "string" }
              - label: "Feature numbers row — items"
                name: "features"
                widget: "list"
                fields:
                  - { label: "Number (e.g. 01)", name: "number", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }

          - label: "Brand Strip"
            name: "brands"
            widget: "object"
            fields:
              - { label: "Label text", name: "label", widget: "text" }
              - label: "Logos / names"
                name: "logos"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Icon (PNG, 16x16px)", name: "icon", widget: "image", required: false }

          - label: "\"Behind the Designs\" Section"
            name: "behind"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Subtext (next to button)", name: "subtext", widget: "string" }
              - { label: "Button label", name: "cta_label", widget: "string" }
              - { label: "Button link", name: "cta_link", widget: "string" }

          - label: "Gallery (3-image grid)"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Caption", name: "caption", widget: "string" }

          - label: "Case Studies"
            name: "case_studies"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Section label (e.g. Case Study — 01)", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Client", name: "client", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Tools", name: "tools", widget: "string" }
              - { label: "Brief", name: "brief", widget: "text" }
              - { label: "Approach", name: "approach", widget: "text" }
              - label: "Deliverables"
                name: "deliverables"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Caption", name: "caption", widget: "string" }
              - label: "\"Did You Know?\" ticker facts (optional)"
                name: "ticker_facts"
                widget: "list"
                required: false
                field: { label: "Fact", name: "fact", widget: "string" }
              - { label: "\"View more\" button label", name: "view_more_label", widget: "string", required: false }
              - { label: "\"View more\" button link (leave blank to hide button)", name: "view_more_link", widget: "string", required: false }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - label: "Bio paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

          - label: "Socials / CTA buttons (footer)"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }
              - label: "Button style"
                name: "style"
                widget: "select"
                options: ["primary", "secondary"]

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Footer title", name: "title", widget: "string" }
              - { label: "Name / signature", name: "name", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }

          - label: "Documents (resume, PDFs, etc.)"
            name: "documents"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "File", name: "file", widget: "file", required: false }
